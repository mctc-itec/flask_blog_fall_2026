{% extends 'base.html' %}
{% block content %}

<!-- For displaying any error messages  -->
{% with messages = get_flashed_messages() %}
{% if messages %}
    <ul class="flashed-message">
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
    </ul>
{% endif %}
{% endwith %}


<form action="{{ url_for('submit_new_blog_post') }}" method="POST">

    <label for="post-title">Title</label>
    <input type="text" name="title" id="post-title" placeholder="Post title" value="{{title}}">

    <label for="post-text">Text</label>
    <textarea name="text" id="post-text" placeholder="Write your post here">{{text}}</textarea>

    <button type="submit" class="blog-button">Submit New Post</button>

</form>

{% endblock %}
